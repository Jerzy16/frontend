<section class="productos-page">
  <div class="form-card">
    <h2>{{ producto.id ? 'Editar producto' : 'Nuevo producto' }}</h2>
    <form (ngSubmit)="producto.id ? actualizar() : guardar()">
      <label>
        Nombre
        <input
          name="nombre"
          [(ngModel)]="producto.nombre"
          required
          placeholder="Nombre del producto"
        />
      </label>
      <label>
        Precio
        <input
          name="precio"
          type="number"
          [(ngModel)]="producto.precio"
          required
          min="0"
          placeholder="Precio"
        />
      </label>
      <div class="button-row">
        <button type="submit">{{ producto.id ? 'Actualizar' : 'Guardar' }}</button>
        <button type="button" class="secondary" (click)="limpiar()">
          Limpiar
        </button>
      </div>
    </form>
  </div>

  <div class="list-card">
    <h2>Productos existentes</h2>
    <table *ngIf="productos.length > 0; else noProducts">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Precio</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let producto of productos">
          <td>{{ producto.nombre }}</td>
          <td>{{ producto.precio | currency:'USD':'symbol':'1.0-0' }}</td>
          <td>
            <button type="button" (click)="editar(producto)">Editar</button>
            <button type="button" class="danger" (click)="producto.id && eliminar(producto.id)">
              Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    <ng-template #noProducts>
      <p class="empty-state">No hay productos registrados.</p>
    </ng-template>
  </div>
</section>
